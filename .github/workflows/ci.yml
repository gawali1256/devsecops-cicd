name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

env:
  DOCKER_IMAGE: devsecops-demo:${{ github.sha }}

jobs:
  ci:
    name: CI (Lint + Tests)
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.workspace.outputs.path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint Python files
        run: |
          python -m pip install ruff==0.6.9
          python -m ruff check app tests

      - name: Run unit tests
        run: |
          python -m pytest -q

      - name: Save workspace path
        id: workspace
        run: echo "path=$(pwd)" >> $GITHUB_OUTPUT

      - name: Upload pytest cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache

  python_build:
    name: Python Build
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Upload Python build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl

