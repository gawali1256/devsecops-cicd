name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  DOCKER_IMAGE: devsecops-demo:${{ github.sha }}

jobs:
  ci:
    name: CI (Lint + Tests)
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.workspace.outputs.path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint Python files
        run: |
          python -m pip install ruff==0.6.9
          python -m ruff check app tests

      - name: Run unit tests
        run: |
          python -m pytest -q

      - name: Save workspace path
        id: workspace
        run: echo "path=$(pwd)" >> $GITHUB_OUTPUT

      - name: Upload pytest cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache

  python_build:
    name: Python Build
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Upload Python build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl

  docker_build_pr:
    name: Docker Build (PR)
    if: ${{ github.event_name == 'pull_request' }}
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --tag $DOCKER_IMAGE .

      - name: Save Docker image
        run: |
          docker save $DOCKER_IMAGE -o devsecops-demo.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: devsecops-demo.tar

  pr_summary:
    name: PR Summary and Artifacts
    if: ${{ github.event_name == 'pull_request' }}
    needs: [ci, docker_build_pr]
    runs-on: ubuntu-latest
    steps:
      - name: Download pytest artifacts
        uses: actions/download-artifact@v4
        with:
          name: pytest-results
          path: ./artifacts
          if-no-files-found: ignore

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./artifacts
          if-no-files-found: ignore

      - name: Generate PR summary
        run: |
          python - <<'PY'
          from pathlib import Path
          out = []
          out.append('## PR Quick Summary')
          if Path('artifacts').exists():
              files = [p.name for p in Path('artifacts').rglob('*') if p.is_file()]
              out.append('### Artifacts uploaded:')
              for f in files:
                  out.append(f'- {f}')
          else:
              out.append('No artifacts found.')
          Path('pr-summary.md').write_text('\n'.join(out))
          PY

      - name: Comment PR summary
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-file: pr-summary.md
          edit-mode: replace

